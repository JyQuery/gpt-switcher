[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-switcher"
version = "0.1.0"
description = "CLI to switch between saved Codex ChatGPT accounts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
gpt-switcher = "gpt_switcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
